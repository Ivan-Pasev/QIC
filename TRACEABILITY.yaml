schema: qic.traceability.v1
claim_boundary: >-
  Traceability maps implemented artifacts to tests and ADRs. It does not certify
  semantic truth, production security, formal correctness, physical safety,
  legal compliance, or deployment readiness.
slices:
  G0:
    title: Repository + Constitutional Spine
    evidence:
      - constitution/constitution.yaml
      - registry/transitions.json
      - docs/adr/0001-constitutional-kernel.md
  G1:
    title: Canonical Serializer + Digest Kernel
    implementation:
      - qic/core/canonical.py
      - qic/core/digest.py
    tests:
      - tests/test_canonical.py
    adr: docs/adr/0002-canonical-serialization-and-digests.md
  G2:
    title: Root Ontology + Maturity Vector
    implementation:
      - qic/core/ontology.py
      - qic/core/maturity_vector.py
    tests:
      - tests/test_maturity_vector.py
    adr: docs/adr/0003-root-ontology-and-maturity-vector.md
  G3:
    title: Authority + Capability Model
    implementation:
      - qic/core/authority.py
    tests:
      - tests/test_authority.py
    adr: docs/adr/0004-scoped-authority-and-capability.md
  G4:
    title: Transition Engine + Invariant Gate
    implementation:
      - qic/core/transition.py
    tests:
      - tests/test_transition.py
    adr: docs/adr/0005-transition-engine-and-invariant-gate.md
  G5:
    title: Chrono + Witness
    implementation:
      - qic/core/chrono.py
    tests:
      - tests/test_chrono.py
      - tests/test_chrono_anchor.py
    adr: docs/adr/0006-chrono-and-witness.md
  G6:
    title: Minimal KBI
    implementation:
      - qic/core/kbi.py
    tests:
      - tests/test_kbi.py
      - tests/test_kbi_golden.py
      - tests/test_kbi_freshness_input.py
    adr: docs/adr/0007-minimal-kbi.md
  G7:
    title: Genesis CLI + Verification
    implementation:
      - qic/cli.py
      - QIC_MANIFEST.json
    tests:
      - tests/test_cli.py
    adr: docs/adr/0008-genesis-cli-verification.md
  G8:
    title: Adversarial Constitutional Qualification
    implementation:
      - qic/qualification.py
      - docs/qualification/FAILURE_ATLAS.yaml
      - QUALIFICATION_REPORT.md
      - QIC_MANIFEST.json
    tests:
      - tests/adversarial/test_qualification.py
    cli:
      - qic verify qualification
      - qic --json verify
    modeled_mutants:
      - scalar_maturity_collapse
      - authority_any_of
      - enable_t4
      - ignore_chrono_anchor
      - count_echo_bindings
    adr: docs/adr/0009-adversarial-constitutional-qualification.md
  RC0:
    title: Integrated Genesis Release Convergence
    version: 1.0.0rc0
    base_merge: b0c4f446dce21317cbd4cfc943633ee57507a8c8
    release_engineering:
      - pyproject.toml
      - qic/release_cli.py
      - qic/resources/
      - RELEASE_NOTES_RC0.md
      - .github/workflows/ci.yml
    tests:
      - tests/test_release_resources.py
      - tests/test_cli.py
    artifact_gate:
      - wheel and sdist build
      - required packaged-resource inspection
      - clean wheel install outside repository checkout
      - qic --json verify
      - qic --json verify qualification
      - package/metadata version equality
      - SHA-256 artifact inventory
    nonclaims:
      - no new constitutional capability
      - no T4/T5 enablement
      - no formal or hardware maturity increase
  G9:
    title: Durable Transaction Journal + Crash Recovery
    implementation:
      - qic/core/journal.py
      - qic/core/journal_store.py
      - qic/core/recovery.py
      - qic/core/recovery_store.py
      - schemas/recovery.schema.json
      - RECOVERY_QUALIFICATION_G9.md
    tests:
      - tests/test_journal.py
      - tests/test_journal_store.py
      - tests/test_recovery_reconciliation.py
      - tests/test_recovery_store.py
      - tests/test_recovery_crash_campaign.py
      - tests/test_recovery_corruption_cases.py
      - tests/test_recovery_rejected_outcomes.py
      - tests/test_recovery_schema.py
    recovery_contract:
      - immutable hash-linked journal records
      - fsync plus atomic no-replace hard-link reference persistence
      - unique same-directory temp files so stale crash residue does not block retry
      - concurrent conflicting promotion cannot overwrite an existing winner
      - exact journal-head-bound recovery evidence receipts
      - conservative mismatch and ahead-of-journal quarantine
      - no evidence synthesis
      - rejected G4 outcomes remain non-commits after restart
      - no double state-commit classification after STATE_COMMITTED
      - restart/idempotent reconciliation
    adr: docs/adr/0011-durable-journal-and-crash-recovery.md
    nonclaims:
      - no universal filesystem durability proof
      - no automatic authority restoration
      - no automatic transition replay
      - no T4/T5 enablement
      - no federation or physical effect
  G10:
    title: Performance Observatory + Workload Atlas + Scaling/Bottleneck Evidence
    implementation:
      - qic/observatory.py
      - qic/performance_evidence.py
      - qic/performance_campaign.py
      - qic/workload_atlas.py
      - scripts/run_g10_campaigns.py
      - .github/workflows/ci.yml
    tests:
      - tests/test_observatory.py
      - tests/test_performance_evidence.py
      - tests/test_performance_campaign.py
      - tests/test_workload_atlas.py
    evidence:
      - PERFORMANCE_BASELINE_G10.md
      - PERFORMANCE_FINDINGS_G10.md
      - GitHub Actions run 33719689186
      - artifact 9879769833 / Python 3.12 raw campaign evidence
      - artifact 9879770182 / Python 3.13 raw campaign evidence
    measured_finding:
      id: G10-BF-001
      class: SERIALIZATION_BOUND
      scope: current Python canonical.digest path for a 1000-integer tuple only
      decision: algorithmic canonicalizer optimization before accelerator hypotheses
    measurement_contract:
      - warmups explicit and excluded from measured samples
      - underlying workload result preserved
      - semantic result identity stable across measured repetitions
      - raw canonical evidence uses integer/string/fixed-point identity fields
      - floating statistics are derived non-identity views
      - atlas binds only live G0-G9 callables and fails closed on symbol drift
      - environment-specific timings are not cross-platform reproducibility targets
      - no accelerator without measured bottleneck
    adr: docs/adr/0012-performance-observatory-and-measurement-evidence.md
    nonclaims:
      - no QIC-wide bottleneck claim
      - no accelerator implementation or hardware recommendation
      - no T4/T5 enablement
      - no federation
      - no formal or hardware maturity increase
  G11:
    title: Canonicalizer Algorithmic Optimization + Byte-Identity Preservation
    implementation:
      - qic/core/canonical.py
      - scripts/run_g11_compare.py
      - scripts/run_g11_comparison.py
      - .github/workflows/ci.yml
    tests:
      - tests/test_canonical_optimization.py
      - inherited G1/G8/G9/G10/RC0 suites
    evidence:
      - PERFORMANCE_OPTIMIZATION_G11.md
      - GitHub Actions run 33798799289
      - artifact 9910239274 / Python 3.12 counterbalanced comparison evidence
      - artifact 9910240220 / Python 3.13 counterbalanced comparison evidence
    byte_identity_contract:
      - production canonical bytes must equal the frozen G1 reference
      - any divergence rejects the candidate regardless of speed
      - fail-closed unsupported-value behavior remains equivalent
    measured_result:
      - size-1000 Python 3.12 median improvement 44.2355 percent
      - size-1000 Python 3.13 median improvement 44.6151 percent
      - residual same-job serialization share estimate about 95 percent in both environments
    decision:
      - admit algorithmic optimization only after final exact-head qualification
      - no accelerator selected by G11
    adr: docs/adr/0013-canonicalizer-algorithmic-optimization.md
    nonclaims:
      - no algorithmic complexity proof
      - no portable performance guarantee
      - no accelerator implementation or hardware recommendation
      - no T4/T5 enablement
      - no federation
      - no maturity increase
  G12:
    title: Residual Canonicalization Characterization + Plain-Integer Tuple Specialization
    status: MERGED
    implementation:
      - qic/core/canonical.py
      - scripts/run_g12_residual_profile.py
      - .github/workflows/g12.yml
      - QIC_MANIFEST.json
      - qic/resources/QIC_MANIFEST.json
    tests:
      - tests/test_canonical_optimization.py
      - inherited G1/G8/G9/G10/G11/RC0 suites
    evidence:
      - PERFORMANCE_CHARACTERIZATION_G12.md
      - GitHub Actions G12 exact-head run 33804645371
      - GitHub Actions inherited exact-head CI run 33804645433
      - implementation merge 2c558c0550c1f8d7db7591ad7b3fe523795bd2dc
      - post-merge state-seal merge b966b9e3e5d2271612343276b32833d721a99128
      - post-merge state-seal CI run 33859982342
    measurement_contract:
      - timing and allocation are measured in separate channels
      - tracemalloc-contaminated timing evidence is rejected
      - proxy microkernels are non-attributive and not nested stage shares
      - reference candidates must be exact-byte identical before timing interpretation
      - no accelerator from timing share alone
    specialization_contract:
      - fast path applies only when every tuple element has exact type int
      - bool and IntEnum do not enter the specialization
      - one-pass buffer attempt rolls back before generic fallback
      - all nonmatching canonical values preserve the generic G11 path
      - frozen G1 remains the differential byte oracle
    measured_result:
      - size-1000 current-vs-frozen-G1 Python 3.12 median improvement 66.09 percent
      - size-1000 current-vs-frozen-G1 Python 3.13 median improvement 63.23 percent
      - size-1000 traced peak allocation reduced from about 180884 bytes to about 60608 bytes
      - Python 3.12 bounded residual serialization-share estimate 92.87 percent
      - Python 3.13 serialization-share estimate withheld because independent digest median was below serializer median
    decision:
      - merged one-pass growing-buffer homogeneous plain-int tuple specialization
      - reject flattened-parts candidate as balanced production choice because of high peak allocation
      - no native or hardware accelerator selected
    adr: docs/adr/0014-residual-canonicalization-and-int-tuple-specialization.md
    nonclaims:
      - no algorithmic optimality proof
      - no portable performance guarantee
      - no exact nested proxy attribution
      - no accelerator implementation or hardware recommendation
      - no T4/T5 enablement
      - no federation
      - no maturity increase
  G13:
    title: Canonical Workload Generalization Atlas
    status: MERGED
    implementation:
      - scripts/run_g13_workload_atlas.py
      - .github/workflows/g13.yml
      - QIC_MANIFEST.json
      - qic/resources/QIC_MANIFEST.json
    evidence:
      - PERFORMANCE_CHARACTERIZATION_G13.md
      - GitHub Actions exact-head workload-atlas run 33860813207
      - GitHub Actions exact-head inherited CI run 33860813177
      - artifact 9932031167 / Python 3.12 final workload matrix
      - artifact 9932032188 / Python 3.13 final workload matrix
      - artifact digest sha256:95cc24cc9d0b6ae20bbad8a3e5e08e729f28b28c1245069ebe475240e41ef5a4 / Python 3.12
      - artifact digest sha256:a752263cc163d2eced72a535a1e880a02e8bf313de7f1ee05ea1fe6b991ceb7f / Python 3.13
      - implementation merge a826d51848a66825131406538429ed929a112ce5
    measurement_contract:
      - ten deterministic payload families across sizes 10, 100, and 1000
      - timing excludes tracemalloc
      - allocation uses a separate traced channel
      - every declared payload is compared to frozen G1 canonical bytes
      - no independent-timing subtraction as exact nested attribution
    measured_result:
      - size-1000 reference characterization plain-int tuple median 266512 ns on Python 3.12 and 241218 ns on Python 3.13
      - size-1000 reference characterization dataclass tuple median 8887552 ns on Python 3.12 and 8434895 ns on Python 3.13
      - size-1000 dataclass tuple traced peak allocation 483782 bytes
      - all declared family-size records preserved exact frozen-G1 byte identity
    decision:
      - characterization-only merge; no production canonicalizer change
      - do not continue plain-int tuple micro-polishing from this evidence
      - dataclass metadata/type-name/field-name work is the strongest next measured Python-level investigation hypothesis
      - no native or hardware accelerator selected
    adr: docs/adr/0015-canonical-workload-generalization.md
    nonclaims:
      - no representative production workload-frequency claim
      - no portable performance guarantee
      - no causal attribution from median nanoseconds per encoded byte
      - no native extension or accelerator implementation/recommendation
      - no T4/T5 enablement
      - no federation
      - no maturity increase
