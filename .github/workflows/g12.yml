name: G12 Residual Profile

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_g12_residual_profile.py"
      - "qic/core/canonical.py"
      - "qic/core/digest.py"
      - "qic/observatory.py"
      - ".github/workflows/g12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g12-residual-profile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install QIC
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run G12 residual characterization
        run: |
          python scripts/run_g12_residual_profile.py \
            --output g12-residual-evidence \
            --warmups 3 \
            --repetitions 15
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('g12-residual-evidence/manifest.json').read_text())
          assert manifest['format'] == 'QIC-G12-RESIDUAL-PROFILE/2.0'
          assert len(manifest['records']) == 3
          assert all(len(record['exact_production_measurements']) == 3 for record in manifest['records'])
          assert all(len(record['proxy_measurements']) == 6 for record in manifest['records'])
          measurements = [
              measurement
              for record in manifest['records']
              for group in ('exact_production_measurements', 'proxy_measurements')
              for measurement in record[group]
          ]
          assert all('timing' in measurement and 'allocation' in measurement for measurement in measurements)
          assert all(measurement['timing']['count'] == 15 for measurement in measurements)
          assert all(measurement['allocation']['count'] == 15 for measurement in measurements)
          assert 'tracemalloc is excluded from timing' in manifest['claim_boundary'].lower()
          assert 'proxy timings are not exact nested attribution' in manifest['claim_boundary'].lower()
          assert 'no accelerator' in manifest['claim_boundary'].lower()
          print(f"environment={manifest['environment']['digest']}; sizes={len(manifest['records'])}")
          PY

      - name: Upload G12 raw characterization evidence
        uses: actions/upload-artifact@v4
        with:
          name: qic-g12-residual-profile-py${{ matrix.python-version }}
          path: g12-residual-evidence/*
          if-no-files-found: error
